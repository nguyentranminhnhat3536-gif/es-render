name: render

# n8n (ES · 2) đẩy file jobs/<id>.json lên repo → workflow này dựng video → đưa MP4 lên Release
# → ghi results/<id>.json (status, url, duration) để n8n đọc rồi đăng bài.
# Dự án HyperFrames: đẩy cả thư mục jobs/<id>/ (có index.html, tạo bằng `npx hyperframes init`) → dựng bằng hf.mjs,
# thư mục được giữ lại để sửa tiếp và đẩy lại.
# Dự án fframes (Rust): thư mục jobs/<id>/ có Cargo.toml (không có index.html, tạo bằng `cargo fframes new`) → dựng bằng ff.mjs.
on:
  push:
    branches: [main]
    paths: ['jobs/**']
  workflow_dispatch:
    inputs:
      job:
        description: 'Đường dẫn job, vd jobs/ES-031-20261019.json, thư mục HyperFrames jobs/intro-01 hoặc thư mục fframes (có Cargo.toml)'
        required: true
      format:
        description: 'Chỉ cho dự án fframes: portrait (9:16) hoặc landscape (16:9) nếu dự án có feature đó; để trống = theo dự án'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: render-${{ github.sha }}-${{ github.event.inputs.job }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # bản HyperFrames mặc định (hf.mjs đọc HF_VERSION); dự án muốn bản khác: jobs/<id>/es-render.json { "hyperframes": "x.y.z" }
      HF_VERSION: 0.8.181
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Tìm job mới
        id: find
        run: |
          if [ -n "${{ github.event.inputs.job }}" ]; then
            IN="${{ github.event.inputs.job }}"; IN="${IN%/}"; FF=""
            if [ -d "$IN" ]; then
              LIST=""; HF="$IN"
              if [ -f "$IN/Cargo.toml" ] && [ ! -f "$IN/index.html" ]; then HF=""; FF="$IN"; fi
            else LIST="$IN"; HF=""; fi
          else
            # job ES: jobs/<id>.json ngay trong jobs/ (không lấy hyperframes.json, package.json… trong thư mục dự án)
            LIST=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- jobs | grep -E '^jobs/[^/]+\.json$' | tr '\n' ' ') || true # bash -eo pipefail: grep không thấy gì không được làm hỏng bước
            # dự án HyperFrames: thư mục jobs/<id>/ có file đổi và có index.html
            HF=$(git diff --name-only --diff-filter=AMR HEAD~1 HEAD -- jobs | grep -E '^jobs/[^/]+/' | cut -d/ -f1-2 | sort -u | while read -r d; do [ -f "$d/index.html" ] && echo "$d"; done | tr '\n' ' ') || true
            # dự án fframes: có Cargo.toml, không có index.html (bỏ qua thư mục chỉ bị xoá)
            FF=$(git diff --name-only --diff-filter=AMR HEAD~1 HEAD -- jobs | grep -E '^jobs/[^/]+/' | cut -d/ -f1-2 | sort -u | while read -r d; do [ -f "$d/Cargo.toml" ] && [ ! -f "$d/index.html" ] && echo "$d"; done | tr '\n' ' ') || true
          fi
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
          echo "hf=$HF" >> "$GITHUB_OUTPUT"
          echo "ff=$FF" >> "$GITHUB_OUTPUT"
          echo "web=$([ -n "$LIST$HF" ] && echo 1)" >> "$GITHUB_OUTPUT"
          echo "any=$([ -n "$LIST$HF$FF" ] && echo 1)" >> "$GITHUB_OUTPUT"
          echo "Jobs: $LIST | HyperFrames: $HF | fframes: $FF"

      - uses: actions/setup-node@v4
        if: steps.find.outputs.any == '1'
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        if: steps.find.outputs.web == '1'
        with:
          python-version: '3.12'

      - name: Cài công cụ (ffmpeg, Chromium, edge-tts)
        if: steps.find.outputs.web == '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji fonts-noto-core > /dev/null
          pip install -q edge-tts==7.3.1
          # đúng phiên bản trong package-lock.json, không cài devDependencies
          npm ci --omit=dev --no-audit --no-fund
          npx playwright install --with-deps chromium
          if [ -n "${{ steps.find.outputs.hf }}" ]; then npx -y "hyperframes@$HF_VERSION" telemetry disable > /dev/null 2>&1 || true; fi
          # ghi lại máy dựng (chỉ log): ảnh Ubuntu + ffmpeg quyết định điểm ảnh của x264 / xfade
          (. /etc/os-release && echo "runner: $PRETTY_NAME"); ffmpeg -version | head -1

      - name: Dựng video
        if: steps.find.outputs.web == '1'
        env:
          RENDER_CONCURRENCY: "3"
        run: |
          mkdir -p out
          for j in ${{ steps.find.outputs.list }}; do
            echo "::group::$j"
            id=$(basename "$j" .json)
            node render.mjs "$j" out && node qa.mjs "out/$id.mp4" "out/$id.result.json" || echo "render lỗi: $j"
            echo "::endgroup::"
          done
          for d in ${{ steps.find.outputs.hf }}; do
            echo "::group::HyperFrames $d"
            id=$(basename "$d")
            node hf.mjs "$d" out && node qa.mjs "out/$id.mp4" "out/$id.result.json" || echo "render lỗi: $d"
            echo "::endgroup::"
          done

      # fframes: chỉ cài Rust/thư viện khi có dự án fframes. Cài trước khi lấy cache vì khoá cache có bản Rust + Ubuntu:
      # rustc mới (stable ra bản mới ~6 tuần/lần) đổi hash mọi crate → build script FFmpeg chạy lại vào thư mục mới, cache cũ vô dụng.
      - name: Cài công cụ fframes (Rust, thư viện FFmpeg, Vulkan phần mềm)
        id: rust
        if: steps.find.outputs.ff != ''
        run: |
          sudo apt-get update -qq
          # mesa-vulkan-drivers = lavapipe: Vulkan chạy bằng CPU cho Skia khi máy CI không có GPU
          sudo apt-get install -y -qq ffmpeg yasm nasm pkg-config clang libclang-dev ninja-build libx264-dev libx265-dev libopus-dev libvpx-dev libasound2-dev libfontconfig1-dev libwayland-dev libvulkan1 mesa-vulkan-drivers > /dev/null
          rustup toolchain install stable --profile minimal --no-self-update > /dev/null
          rustup default stable
          cargo --version
          echo "key=fframes-$RUNNER_OS-$(. /etc/os-release && echo "$ID$VERSION_ID")-rust$(rustc -V | cut -d' ' -f2)-" >> "$GITHUB_OUTPUT"

      # Lần đầu (và lần đầu sau mỗi bản Rust mới) build ~15–25 phút: tự dựng FFmpeg vì x264 của Ubuntu 24.04 khác bản FFmpeg
      # dựng sẵn. Các lần sau lấy từ cache (~/.cargo + ~/ff-target, ~3 GB), chỉ build lại dự án ~1–2 phút.
      - name: Lấy cache Rust (fframes)
        id: ffcache
        if: steps.find.outputs.ff != ''
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/ff-target
          key: ${{ steps.rust.outputs.key }}${{ hashFiles('jobs/*/Cargo.lock', 'examples/*/Cargo.lock') }}
          restore-keys: ${{ steps.rust.outputs.key }}

      - name: Dựng dự án fframes
        id: ffbuild
        if: steps.find.outputs.ff != ''
        env:
          FF_FORMAT: ${{ github.event.inputs.format }}
        run: |
          export CARGO_TARGET_DIR="$HOME/ff-target"
          mkdir -p out
          for d in ${{ steps.find.outputs.ff }}; do
            echo "::group::fframes $d"
            id=$(basename "$d")
            # build xong ít nhất một dự án mới được lưu cache (build hỏng / bị huỷ mà lưu thì các lần sau dựng lại từ đầu mãi)
            if node ff.mjs "$d" out; then echo "built=1" >> "$GITHUB_OUTPUT"; node qa.mjs "out/$id.mp4" "out/$id.result.json" || true; else echo "render lỗi: $d"; fi
            echo "::endgroup::"
          done
          # bỏ mã nguồn FFmpeg (~1,4 GB) trước khi lưu cache: build script chỉ cần out/dist (thư viện đã dựng)
          find "$CARGO_TARGET_DIR/release/build" -mindepth 3 -maxdepth 3 -path '*/ffmpeg-sys-fframes-*/out/ffmpeg-*' -type d -prune -exec rm -rf {} + 2>/dev/null || true

      # Khoá tính lại SAU khi build: dự án đẩy lên không kèm Cargo.lock thì cargo vừa sinh ra nó (crate có thể khác bản trong
      # cache) → lưu dưới khoá mới. Trùng đúng khoá vừa lấy thì bỏ qua: cache Actions không ghi đè được khoá đã có.
      - name: Lưu cache Rust (fframes)
        if: always() && steps.ffbuild.outputs.built == '1' && steps.ffcache.outputs.cache-primary-key != '' && steps.ffcache.outputs.cache-matched-key != format('{0}{1}', steps.rust.outputs.key, hashFiles('jobs/*/Cargo.lock', 'examples/*/Cargo.lock'))
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/ff-target
          key: ${{ steps.rust.outputs.key }}${{ hashFiles('jobs/*/Cargo.lock', 'examples/*/Cargo.lock') }}

      - name: Đưa video lên Release + ghi kết quả
        if: always() && steps.find.outputs.any == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="videos-$(date -u +%Y-%m)"
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Video ETHAN STUDIO dựng tự động" > /dev/null
          mkdir -p results
          for j in ${{ steps.find.outputs.list }} ${{ steps.find.outputs.hf }} ${{ steps.find.outputs.ff }}; do
            id=$(basename "$j" .json)
            r="out/$id.result.json"
            if [ ! -f "$r" ]; then echo "{\"id\":\"$id\",\"status\":\"error\",\"message\":\"render không tạo kết quả (xem log Actions)\"}" > "$r"; fi
            if [ "$(jq -r .status "$r")" = "done" ] && [ -f "out/$id.mp4" ]; then
              gh release upload "$TAG" "out/$id.mp4" --clobber
              url="https://github.com/${{ github.repository }}/releases/download/$TAG/$id.mp4"
              jq --arg url "$url" --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '. + {url: $url, run: $run}' "$r" > "results/$id.json"
            else
              jq --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '. + {run: $run}' "$r" > "results/$id.json"
            fi
            if [ -f "$j" ]; then git rm -q --cached "$j" 2>/dev/null || true; rm -f "$j"; fi # thư mục HyperFrames / fframes giữ lại
          done
          git config user.name "es-render-bot"
          git config user.email "es-render-bot@users.noreply.github.com"
          git add -A results; git add -u jobs # không thêm file tạm HyperFrames sinh ra trong thư mục dự án
          git commit -q -m "render: kết quả [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 5; done
