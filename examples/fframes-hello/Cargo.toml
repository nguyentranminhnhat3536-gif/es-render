[package]
name = "fframes-hello"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Khung ngang 16:9 (1920×1080) thay cho dọc 9:16 (1080×1920):
#   cargo build --release --features landscape      ·   FF_FORMAT=landscape node ff.mjs <thư mục> out
landscape = []

[dependencies]
fframes = { version = "=1.3.0", features = ["compile-time-svgtree", "cli"] }
fframes_skia_renderer = { version = "=1.3.0", features = ["vulkan", "cli"] }
fframes_native_player = { version = "=1.3.0", default-features = false, features = ["vulkan", "audio"] }

[target.'cfg(not(windows))'.dependencies]
fframes = { version = "=1.3.0", features = ["h264", "libav-agree-gpl"] }

[lib]
name = "fframes_hello"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "fframes-hello"
path = "src/main.rs"

[workspace]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
