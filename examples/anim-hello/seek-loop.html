<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seek loop</title>
<link rel="icon" href="data:,">
<!-- Font: Google Font subset with &text= to the exact glyphs used, display=block (no fallback flash in captures) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@900&display=block&text=SEK0123456789." rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #14142B; overflow: hidden }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block }
  text { font-family: 'Rubik', sans-serif; font-weight: 900 }
</style>
</head>
<body>
<!--
  motion2code page contract (minimal sample, 5 s loop, 1920x1080):
  - window.anim = { tl, duration, seek(t), play(from), pause() }; seek(t) is a pure function of t
  - ?t=2.5 freezes at 2.5 s; ?external=1 does not autoplay; no parameter = plays and loops forever
  - <html data-ready="1"> once fonts are loaded and frame 0 is drawn (renderers wait for it)
  - frame(duration) == frame(0); frame(duration - 1/24) is one step away from it
  - self-contained: inline SVG, GSAP 3 from cdnjs, Google Fonts; no raster, no other network
-->
<svg id="stage" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs><clipPath id="frame"><rect width="1920" height="1080"/></clipPath></defs>
  <g clip-path="url(#frame)">
    <rect id="bg" width="1920" height="1080" fill="#14142B"/>
    <!-- fx: orbiting dots, procedural (draw(t)), positions seeded in build() -->
    <g id="dots"></g>
    <!-- every shape drawn around its own origin (0,0), placed with GSAP x/y -->
    <g id="square"><rect x="-110" y="-110" width="220" height="220" rx="36" fill="#2350FF"/></g>
    <g id="tri"><path d="M0 -130 L120 90 L-120 90 Z" fill="#FFC53D" stroke-linejoin="round"/></g>
    <g id="ball"><circle id="ballShape" r="150" fill="#FF5A7A"/><circle cx="-48" cy="-30" r="16" fill="#14142B"/><circle cx="48" cy="-30" r="16" fill="#14142B"/></g>
    <g id="word" fill="#F6EECD" font-size="220" text-anchor="middle">
      <text class="l" x="690" y="960">S</text><text class="l" x="870" y="960">E</text>
      <text class="l" x="1050" y="960">E</text><text class="l" x="1230" y="960">K</text>
    </g>
    <!-- progress bar + time readout: computed in draw(t) (shows the page-local time, handy to check embedding offsets) -->
    <rect x="160" y="1020" width="1600" height="12" rx="6" fill="#F6EECD" opacity=".15"/>
    <rect id="bar" x="160" y="1020" width="0" height="12" rx="6" fill="#F6EECD"/>
    <text id="clock" x="1760" y="90" font-size="48" fill="#F6EECD" text-anchor="end" opacity=".6">0.00</text>
  </g>
</svg>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(() => {
const DUR = 5;                                    // seconds; the timeline is padded to exactly DUR
const C = { night: '#14142B', plum: '#3B1F5C', pink: '#FF5A7A', blue: '#2350FF', sun: '#FFC53D', cream: '#F6EECD' };
const SVGNS = 'http://www.w3.org/2000/svg';
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));

// The opening frame, defined once. The last shot tweens back to exactly these values: that is the loop.
const OPEN = {
  ball: { x: 960, y: 470, scaleX: 1, scaleY: 1, rotation: 0, transformOrigin: '50% 50%' },
  square: { x: 520, y: 470, rotation: 0, scale: 0.8, transformOrigin: '50% 50%' },
  tri: { x: 1400, y: 470, rotation: 0, scale: 0.8, transformOrigin: '50% 50%' },
  bg: { fill: C.night },
  letters: { scale: 0, transformOrigin: '50% 100%' }
};
function setOpening() {
  gsap.set('#ball', OPEN.ball);
  gsap.set('#square', OPEN.square);
  gsap.set('#tri', OPEN.tri);
  gsap.set('#bg', OPEN.bg);
  gsap.set('#word .l', OPEN.letters);
}

// seeded PRNG: no Math.random at draw time
const rnd = (s => () => (s = (s * 16807) % 2147483647) / 2147483647)(42);
const DOTS = [];

// ---------- one timeline = the only clock ----------
const tl = gsap.timeline({ paused: true, repeat: -1, defaults: { ease: 'power2.inOut' } });

function build() {
  const g = document.getElementById('dots');
  for (let i = 0; i < 14; i++) {
    const c = document.createElementNS(SVGNS, 'circle');
    c.setAttribute('r', (6 + rnd() * 10).toFixed(1));
    c.setAttribute('fill', [C.pink, C.blue, C.sun, C.cream][i % 4]);
    g.appendChild(c);
    DOTS.push({ el: c, a0: rnd() * Math.PI * 2, r: 300 + rnd() * 160, laps: 1 + (i % 2) }); // whole laps per loop: seam-safe
  }
  setOpening();
  // shot 1 (0.30-1.10): ball squashes then hops; square and triangle swing out
  tl.to('#ball', { scaleX: 1.2, scaleY: 0.8, duration: 0.3, ease: 'power2.in' }, 0.30)
    .to('#ball', { y: 300, scaleX: 0.9, scaleY: 1.12, duration: 0.35, ease: 'power3.out' }, 0.60)
    .to('#square', { x: 360, rotation: -90, scale: 1, duration: 0.5, ease: 'back.out(2)' }, 0.40)
    .to('#tri', { x: 1560, rotation: 120, scale: 1, duration: 0.5, ease: 'back.out(2)' }, 0.45)
  // shot 2 (0.95-2.00): lands with a squash and elastic settle, background flips, word pops letter by letter
    .to('#ball', { y: 470, scaleX: 1, scaleY: 1, duration: 0.25, ease: 'power2.in' }, 0.95)
    .to('#ball', { scaleX: 1.25, scaleY: 0.8, duration: 0.08, ease: 'none' }, 1.20)
    .to('#ball', { scaleX: 1, scaleY: 1, duration: 0.5, ease: 'elastic.out(1.1, 0.4)' }, 1.28)
    .to('#bg', { fill: C.plum, duration: 0.01 }, 1.20)
    .to('#word .l', { scale: 1, duration: 0.4, ease: 'back.out(3)', stagger: 0.1 }, 1.30)
  // shot 3 (2.00-3.30): the ball spins once, side shapes trade places
    .to('#ball', { rotation: 360, duration: 1.0, ease: 'power3.inOut' }, 2.00)
    .to('#square', { y: 300, rotation: -270, duration: 0.8 }, 2.10)
    .to('#tri', { y: 640, rotation: 300, duration: 0.8 }, 2.10)
    .set('#ball', { rotation: 0 }, 3.00)          // 360 == 0 visually: reset so later tweens start clean
  // shot 4 (3.30-4.60): everything returns to OPEN; 4.60-5.00 holds the opening frame (hides the wrap)
    .to('#word .l', { scale: 0, duration: 0.3, ease: 'back.in(2)', stagger: { each: 0.06, from: 'end' } }, 3.30)
    .to('#bg', { fill: C.night, duration: 0.01 }, 3.90)
    .to('#square', { ...OPEN.square, rotation: -360, duration: 0.6, ease: 'power3.out' }, 3.90)
    .to('#tri', { ...OPEN.tri, rotation: 360, duration: 0.6, ease: 'power3.out' }, 3.95)
    .set('#square', { rotation: 0 }, 4.55)
    .set('#tri', { rotation: 0 }, 4.55)
    .set({}, {}, DUR);                             // pad the timeline to exactly DUR
  tl.eventCallback('onUpdate', () => draw(tl.time()));
}

// procedural part: a pure function of t, called with the same clock as the tweens
function draw(t) {
  const u = clamp(t / DUR);
  for (const d of DOTS) {
    const a = d.a0 + u * d.laps * Math.PI * 2;
    d.el.setAttribute('cx', (960 + Math.cos(a) * d.r * 1.6).toFixed(1));
    d.el.setAttribute('cy', (470 + Math.sin(a) * d.r * 0.55).toFixed(1));
  }
  // bar grows over the loop then snaps back in the last 0.4 s, so frame(DUR) == frame(0)
  const w = t < 4.6 ? 1600 * clamp(t / 4.6) : 1600 * (1 - clamp((t - 4.6) / 0.25));
  document.getElementById('bar').setAttribute('width', w.toFixed(1));
  document.getElementById('clock').textContent = ((t % DUR + DUR) % DUR).toFixed(2);
}

window.anim = {
  tl, duration: DUR,
  seek(t) { t = clamp(t, 0, DUR); tl.pause(); tl.time(t, false); draw(t); },
  play(from = 0) { tl.time(from); tl.play(); },
  pause() { tl.pause(); }
};

const qs = new URLSearchParams(location.search);
const fontsReady = Promise.race([
  Promise.all([document.fonts.load('900 100px "Rubik"', 'SEEK0.123'), document.fonts.ready]),
  new Promise(r => setTimeout(r, 4000))
]);
fontsReady.then(() => {
  build();
  anim.seek(0);
  if (qs.has('t')) anim.seek(parseFloat(qs.get('t')));
  else if (!qs.has('external')) tl.play(0);
  document.documentElement.dataset.ready = '1';
});
})();
</script>
</body>
</html>
